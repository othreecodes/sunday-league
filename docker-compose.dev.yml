# Local development stack: Postgres + Next.js dev server.
# Mirrors production (Postgres, not SQLite) so the Prisma provider never has to
# be switched back and forth before a deploy.
#
#   docker compose -f docker-compose.dev.yml up
#
# App: http://localhost:3100
services:
  db:
    image: postgres:16-alpine
    container_name: cowrywise-fc-db
    environment:
      POSTGRES_USER: cowrywise
      POSTGRES_PASSWORD: cowrywise
      POSTGRES_DB: cowrywise_fc
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowrywise -d cowrywise_fc"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dev-db:/var/lib/postgresql/data

  app:
    image: node:20-alpine
    container_name: cowrywise-fc-app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cowrywise:cowrywise@db:5432/cowrywise_fc?schema=public
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: local-development-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      PORT: "3100"
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/.next
    command: >
      sh -c "apk add --no-cache libc6-compat >/dev/null 2>&1;
             npm install --no-audit --no-fund &&
             npx prisma db push --accept-data-loss &&
             npx tsx prisma/dev-seed.ts &&
             npm run dev -- --port 3100 --hostname 0.0.0.0"

volumes:
  dev-db:
  dev-node-modules:
  dev-next:
